<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#101c29"><title>RoadForge Mobile V0.4</title><link rel="manifest" href="manifest.webmanifest"><style>*{box-sizing:border-box}body{margin:0;background:#101c29;color:#edf4fa;font:14px system-ui,sans-serif}header{padding:12px 14px;display:flex;align-items:center;justify-content:space-between;background:#172738}h1{font-size:18px;margin:0}small{color:#aabac9}.toolbar{display:flex;gap:7px;padding:10px;overflow-x:auto;background:#172738}button,select{border:1px solid #456073;background:#243b4c;color:white;border-radius:9px;padding:10px;font:inherit;white-space:nowrap}button.active{background:#3374a6}button:disabled{opacity:.4}main{position:relative;height:calc(100dvh - 176px);min-height:280px;touch-action:none;overflow:hidden}canvas{display:block;width:100%;height:100%;touch-action:none;background:#243d38}footer{display:flex;gap:6px;padding:8px;overflow-x:auto;background:#172738}#status{position:absolute;bottom:10px;left:10px;background:#12232ccc;padding:8px;border-radius:8px;pointer-events:none}#file{display:none}</style></head><body><header><div><h1>🛣️ RoadForge Mobile</h1><small>V0.4 · réseau connecté</small></div><span id="count">0 routes</span></header><div class="toolbar"><button id="draw" class="active">✏️ Route</button><button id="pan">✋ Déplacer</button><button id="edit">🎯 Modifier</button><select id="type"><option value="street">Rue · 8 m</option><option value="avenue">Avenue · 16 m</option><option value="highway">Autoroute · 24 m</option></select><button id="curve">〰️ Courbe</button><button id="flip">⇄ Inverser courbe</button><button id="straight">━ Redresser</button><button id="nodes" class="active">🔗 Nœuds</button><button id="graph">⬇ Réseau JSON</button><button id="undo">↶</button><button id="redo">↷</button></div><main id="viewport"><canvas id="map"></canvas><div id="s (()=>{'use strict';const c=document.querySelector('#map'),ctx=c.getContext('2d'),v=document.querySelector('#viewport'),status=document.querySelector('#status');const widths={street:8,avenue:16,highway:24};let curveMode=false;let showNodes=true;let map={format:'ForgeMap',version:1,units:'meters',roads:[]},mode='draw',selected=null,pending=null,drag=null,view={x:0,y:0,scale:1},history=[],future=[],pointers=new Map(),pinch=null;const $=s=>document.querySelector(s);const uid=()=>globalThis.crypto?.randomUUID?.()||'road-'+Date.now()+'-'+Math.random().toString(36).slice(2);function msg(t){status.textContent=t}function checkpoint(){history.push(JSON.stringify(map));if(history.length>100)history.shift();future=[]}function persist(){localStorage.setItem('roadforge-map-v1',JSON.stringify(map))}function load(){try{let saved=JSON.parse(localStorage.getItem('roadforge-map-v1'));if(valid(saved))map=saved}catch{}}function valid(m){return m&&m.format==='ForgeMap'&&m.version===1&&Array.isArray(m.roads)&&m.roads.every(r=>r&&typeof r.id==='string'&&widths[r.type]&&Number.isFinite(r.a?.x)&&Number.isFinite(r.a?.y)&&Number.isFinite(r.b?.x)&&Number.isFinite(r.b?.y)&&(!r.control||(Number.isFinite(r.control.x)&&Number.isFinite(r.control.y))))}function resize(){const dpr=Math.min(devicePixelRatio||1,2),rect=v.getBoundingClientRect();c.width=Math.round(rect.width*dpr);c.height=Math.round(rect.height*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);render()}const size=()=>({w:v.clientWidth,h:v.clientHeight});const screen=p=>({x:p.x*view.scale+size().w/2+view.x,y:p.y*view.scale+size().h/2+view.y});const world=p=>({x:(p.x-size().w/2-view.x)/view.scale,y:(p.y-size().h/2-view.y)/view.scale});const snap=p=>{let candidate=null,best=12/view.scale;for(const r of map.roads){for(const q of [r.a,r.b]){const d=Math.hypot(q.x-p.x,q.y-p.y);if(d<best){best=d;candidate=q}}}return candidate?{...candidate}:{x:Math.round(p.x/5)*5,y:Math.round(p.y/5)*5}};
function sample(r,n=24){if(!r.control)return[r.a,r.b];return Array.from({length:n+1},(_,i)=>{let t=i/n,u=1-t;return{x:u*u*r.a.x+2*u*t*r.control.x+t*t*r.b.x,y:u*u*r.a.y+2*u*t*r.control.y+t*t*r.b.y}})}
function crossing(a,b,c,d){let den=(b.x-a.x)*(d.y-c.y)-(b.y-a.y)*(d.x-c.x);if(Math.abs(den)<1e-8)return null;let t=((c.x-a.x)*(d.y-c.y)-(c.y-a.y)*(d.x-c.x))/den,u=((c.x-a.x)*(b.y-a.y)-(c.y-a.y)*(b.x-a.x))/den;if(t<0||t>1||u<0||u>1)return null;return{x:a.x+t*(b.x-a.x),y:a.y+t*(b.y-a.y)}}
// Graph derived from roads; roads remain the editable source of truth.
// Intersections are computed using sampled Bezier polylines. Grade separation is
// intentionally deferred: all roads in this milestone are on the same level.
function graphBuild(){
 const roads=map.roads, segments=[], cuts=roads.map(()=>[0,1]);

  const pts=sample(roads[i],roads[i].control?48:1),n=pts.length-1;
  for(let k=0;k<n;k++)segments.push({i,a:pts[k],b:pts[k+1],t0:k/n,t1:(k+1)/n});
 }
 function intersect(a,b,c,d){const dx=b.x-a.x,dy=b.y-a.y,ex=d.x-c.x,ey=d.y-c.y,den=dx*ey-dy*ex;
  if(Math.abs(den)<1e-9)return null;
  const u=((c.x-a.x)*ey-(c.y-a.y)*ex)/den,v=((c.x-a.x)*dy-(c.y-a.y)*dx)/den;
  if(u< -1e-8||u>1+1e-8||v< -1e-8||v>1+1e-8)return null;
  return {u:Math.max(0,Math.min(1,u)),v:Math.max(0,Math.min(1,v))};}
 for(let a=0;a<segments.length;a++)for(let b=a+1;b<segments.length;b++){
  const x=segments[a],y=segments[b];if(x.i===y.i)continue;
  const h=intersect(x.a,x.b,y.a,y.b);if(!h)continue;
  cuts[x.i].push(x.t0+(x.t1-x.t0)*h.u);cuts[y.i].push(y.t0+(y.t1-y.t0)*h.v);
 }
 const nodes=[],edges=[];
 function at(r,t){if(!r.control)return{x:r.a.x+(r.b.x-r.a.x)*t,y:r.a.y+(r.b.y-r.a.y)*t};const u=1-t;return{x:u*u*r.a.x+2*u*t*r.control.x+t*t*r.b.x,y:u*u*r.a.y+2*u*t*r.control.y+t*t*r.b.y}}
 function node(p){let idx=nodes.findIndex(n=>Math.hypot(n.x-p.x,n.y-p.y)<0.5);if(idx>=0)return nodes[idx].id;let id='n'+nodes.length;nodes.push({id,x:p.x,y:p.y});return id}
 for(let i=0;i<roads.length;i++){
  const r=roads[i],sorted=cuts[i].sort((a,b)=>a-b).filter((t,j,arr)=>j===0||t-arr[j-1]>0.00001);
  for(let j=1;j<sorted.length;j++){
   const t0=sorted[j-1],t1=sorted[j],a=at(r,t0),b=at(r,t1);if(Math.hypot(a.x-b.x,a.y-b.y)<0.01)continue;
   const from=node(a),to=node(b);if(from===to)continue;
   edges.push({id:r.id+':'+j,roadId:r.id,from,to,type:r.type,widthMeters:widths[r.type],t0,t1});
  }
 }
 const degrees=Object.fromEntries(nodes.map(n=>[n.id,0]));for(const e of edges){degrees[e.from]++;degrees[e.to]++}
 return {format:'ForgeRoadGraph',version:1,units:'meters',nodes:nodes.map(n=>({...n,degree:degrees[n.id]})),edges};
}
function intersections(){const g=graphBuild();return g.nodes.filter(n=>n.degree>=3)}
function roadPath(r){const a=screen(r.a),b=screen(r.b);ctx.beginPath();ctx.moveTo(a.x,a.y);if(r.control){const q=screen(r.control);ctx.quadraticCurveTo(q.x,q.y,b.x,b.y)}else ctx.lineTo(b.x,b.y)}function render(){let {w,h}=size();ctx.clearRect(0,0,w,h);ctx.fillStyle='#243d38';ctx.fillRect(0,0,w,h);let step=20;while(step*view.scale<22)step*=2;let left=world({x:0,y:0}),right=world({x:w,y:h});ctx.strokeStyle='#52756b55';ctx.lineWidth=1;ctx.beginPath();for(let x=Math.floor(left.x/step)*step;x<=right.x;x+=step){let sx=screen({x,y:0}).x;ctx.moveTo(sx,0);ctx.lineTo(sx,h)}for(let y=Math.floor(left.y/step)*step;y<=right.y;y+=step){let sy=screen({x:0,y}).y;ctx.moveTo(0,sy);ctx.lineTo(w,sy)}ctx.stroke();for(const r of map.roads){let width=Math.max(3,widths[r.type]*view.scale);ctx.lineCap='round';ctx.strokeStyle=r.id===selected?'#fbbf67':'#102129';ctx.lineWidth=width+4;roadPath(r);ctx.stroke();ctx.strokeStyle=r.type==='highway'?'#d8b58a':r.type==='avenue'?'#a2bacb':'#d7dedf';ctx.lineWidth=width;roadPath(r);ctx.stroke();ctx.strokeStyle='#f7e7aa';ctx.lineWidth=1.2;ctx.setLineDash([8,8]);roadPath(r);ctx.stroke();ctx.setLineDash([])}for(const p of (showNodes?intersections():[])){let q=screen(p);ctx.fillStyle='#72f3ad';ctx.strokeStyle='#143c2d';ctx.lineWidth=2;ctx.beginPath();ctx.arc(q.x,q.y,Math.max(3,4*view.scale),0,Math.PI*2);ctx.fill();ctx.stroke()}
if(selected&&mode==='edit'){const r=map.roads.find(r=>r.id===selected);if(r){for(const [kind,p] of [['a',r.a],['b',r.b],...(r.control?[['control',r.control]]:[])]){const q=screen(p);ctx.beginPath();ctx.arc(q.x,q.y,kind==='control'?10:9,0,Math.PI*2);ctx.fillStyle=kind==='control'?'#f8b94e':'#5ce5ac';ctx.fill();ctx.strokeStyle='#102129';ctx.lineWidth=2;ctx.stroke()}}}
if(pending){let a=screen(pending);ctx.fillStyle='#64e5a3';ctx.beginPath();ctx.arc(a.x,a.y,6,0,Math.PI*2);ctx.fill()}$('#count').textContent=map.roads.length+' routes · '+intersections().length+' carrefours'}function pos(e){const r=c.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}function closest(p){let best=null,dist=Infinity;for(const r of map.roads){let pts=sample(r).map(screen);for(let i=1;i<pts.length;i++){let a=pts[i-1],b=pts[i],dx=b.x-a.x,dy=b.y-a.y,t=Math.max(0,Math.min(1,((p.x-a.x)*dx+(p.y-a.y)*dy)/(dx*dx+dy*dy||1)));let d=Math.hypot(p.x-a.x-t*dx,p.y-a.y-t*dy);if(d<Math.max(12,widths[r.type]*view.scale/2+7)&&d<dist){dist=d;best=r.id}}}return best}
function hitHandle(p){if(mode!=='edit')return null;for(const r of [...map.roads].reverse()){for(const kind of ['control','a','b']){if(!r[kind])continue;const q=screen(r[kind]);if(Math.hypot(q.x-p.x,q.y-p.y)<19)return {road:r.id,kind}}}return null}
function setMode(m){mode=m;pending=null;selected=null;for(const n of ['draw','pan','edit'])$('#'+n).classList.toggle('active',n===m);msg(m==='draw'?'Touchez deux points pour tracer une route':m==='pan'?'Glissez pour déplacer la carte': 'Touchez une route pour la sélectionner, puis déplacez-la');render()}function clickAt(p){if(mode==='draw'){let w=snap(world(p));if(!pending){pending=w;msg('Touchez le point d’arrivée')}else{if(Math.hypot(w.x-pending.x,w.y-pending.y)>=5){checkpoint();let road={id:uid(),type:$('#type').value,a:pending,b:w};if(curveMode){let dx=w.x-pending.x,dy=w.y-pending.y;road.control={x:(w.x+pending.x)/2-dy*.35,y:(w.y+pending.y)/2+dx*.35}}map.roads.push(road);persist()}pending=null;msg('Route ajoutée · touchez pour en tracer une autre')}}else if(mode==='edit'){selected=closest(p);msg(selected?'Route sélectionnée · glissez les poignées vertes/orange ou la route':'Aucune route sélectionnée')}render()}c.addEventListener('pointerdown',e=>{c.setPointerCapture(e.pointerId);pointers.set(e.pointerId,pos(e));if(pointers.size===2){pending=null;let pts=[...pointers.values()];pinch={distance:Math.hypot(pts[0].x-pts[1].x,pts[0].y-pts[1].y),scale:view.scale};drag=null;return}const handle=hitHandle(pos(e));drag={at:pos(e),moved:false,last:pos(e),road:handle?.road||(mode==='edit'?closest(pos(e)):null),handle:handle?.kind||null,initial:mode==='edit'?JSON.stringify(map):null};if(handle)selected=handle.road});c.addEventListener('pointermove',e=>{if(!pointers.has(e.pointerId))return;let p=pos(e);pointers.set(e.pointerId,p);if(pointers.size===2){let pts=[...pointers.values()],d=Math.hypot(pts[0].x-pts[1].x,pts[0].y-pts[1].y);if(pinch){let mid={x:(pts[0].x+pts[1].x)/2,y:(pts[0].y+pts[1].y)/2},before=world(mid);view.scale=Math.max(.15,Math.min(5,pinch.scale*d/(pinch.distance||1)));let after=screen(before);view.x+=mid.x-after.x;view.y+=mid.y-after.y;render()}return}if(!drag)return;let d=Math.hypot(p.x-drag.at.x,p.y-drag.at.y);if(d>7)drag.moved=true;if(mode==='pan'||(mode==='edit'&&!drag.road)){view.x+=p.x-drag.last.x;view.y+=p.y-drag.last.y;render()}else if(mode==='edit'&&drag.road&&drag.moved){let old=JSON.parse(drag.initial),r0=old.roads.find(r=>r.id===drag.road),r=map.roads.find(r=>r.id===drag.road),dx=(p.x-drag.at.x)/view.scale,dy=(p.y-drag.at.y)/view.scale;if(drag.handle){r[drag.handle]={x:r0[drag.handle].x+dx,y:r0[drag.handle].y+dy}}else{r.a={x:r0.a.x+dx,y:r0.a.y+dy};r.b={x:r0.b.x+dx,y:r0.b.y+dy};if(r0.control)r.control={x:r0.control.x+dx,y:r0.control.y+dy}}render()}drag.last=p});function up(e){let p=pos(e);pointers.delete(e.pointerId);if(pointers.size===0){if(drag){if(!drag.moved)clickAt(p);else if(mode==='edit'&&drag.road){history.push(drag.initial);future=[];persist();selected=drag.road}}drag=null;pinch=null;render()}else if(pointers.size===1){drag=null;pinch=null}}c.addEventListener('pointerup',up);c.addEventListener('pointercancel',up);c.addEventListener('wheel',e=>{e.preventDefault();let p=pos(e),w=world(p);view.scale=Math.max(.15,Math.min(5,view.scale*(e.deltaY<0?1.12:.89)));let s=screen(w);view.x+=p.x-s.x;view.y+=p.y-s.y;render()},{passive:false});$('#curve').onclick=()=>{curveMode=!curveMode;$('#curve').classList.toggle('active',curveMode);setMode('draw');msg(curveMode?'Mode courbe : touchez début et fin (courbure automatique)':'Mode ligne droite')};$('#flip').onclick=()=>{const r=map.roads.find(r=>r.id===selected);if(!r){msg('Sélectionnez une route dans Modifier');return}checkpoint();const mx=(r.a.x+r.b.x)/2,my=(r.a.y+r.b.y)/2;if(!r.control){const dx=r.b.x-r.a.x,dy=r.b.y-r.a.y;r.control={x:mx-dy*.35,y:my+dx*.35}}else{r.control={x:2*mx-r.control.x,y:2*my-r.control.y}}persist();render();msg('Courbe inversée · poignée orange modifiable')};
$('#straight').onclick=()=>{const r=map.roads.find(r=>r.id===selected);if(!r){msg('Sélectionnez une route dans Modifier');return}if(!r.control)return;checkpoint();delete r.control;persist();render();msg('Route redressée')};
$('#nodes').onclick=()=>{showNodes=!showNodes;$('#nodes').classList.toggle('active',showNodes);render();msg(showNodes?'Affichage des carrefours activé':'Affichage des carrefours masqué')};
$('#graph').onclick=()=>{const graph=graphBuild(),blob=new Blob([JSON.stringify(graph,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='roadforge-network.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);msg(graph.nodes.length+' nœuds et '+graph.edges.length+' connexions exportés')};
$('#draw').onclick=()=>{curveMode=false;$('#curve').classList.remove('active');setMode('draw')};$('#pan').onclick=()=>setMode('pan');$('#edit').onclick=()=>setMode('edit');$('#undo').onclick=()=>{if(history.length){future.push(JSON.stringify(map));map=JSON.parse(history.pop());persist();render()}};$('#redo').onclick=()=>{if(future.length){history.push(JSON.stringify(map));map=JSON.parse(future.pop());persist();render()}};$('#delete').onclick=()=>{if(!selected){msg('Sélectionnez une route avec Modifier');return}checkpoint();map.roads=map.roads.filter(r=>r.id!==selected);selected=null;persist();render()};$('#save').onclick=()=>{persist();msg('Carte sauvegardée sur cet appareil')};$('#reset').onclick=()=>{if(confirm('Créer une carte vide ?')){checkpoint();map={format:'ForgeMap',version:1,units:'meters',roads:[]};selected=null;pending=null;persist();render()}};$('#export').onclick=()=>{const blob=new Blob([JSON.stringify(map,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='roadforge-map.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};$('#import').onclick=()=>$('#file').click();$('#file').onchange=async e=>{const f=e.target.files?.[0];if(!f)return;try{const imported=JSON.parse(await f.text());if(!valid(imported))throw Error('Format ForgeMap V1 invalide');checkpoint();map=imported;selected=null;pending=null;persist();render();msg('Carte importée')}catch(err){alert('Import impossible : '+err.message)}e.target.value=''};load();resize();new ResizeObserver(resize).observe(v);if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{})})();
</script></body></html>
